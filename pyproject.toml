[project]
name = "brawlstarsagent"
version = "0.1.0"
description = "Brawl Sniper — Web-Based RL Studio & AI Game Agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.8",
    "numpy>=2.2.3",
    "onnx>=1.17.0",
    "onnxruntime>=1.20.1",
    "onnxscript>=0.3.0",
    "pytest>=8.3.4",
    "torch>=2.6.0",
    "uvicorn>=0.34.0",
    "websockets>=14.2",
    "onnxscript>=0.7.1",
    "optuna>=4.9.0",
]

[tool.uv]
# Pull CUDA 12.8 wheels for PyTorch (RTX 3050 6GB, compute 8.6)
extra-index-url = ["https://download.pytorch.org/whl/cu128"]
